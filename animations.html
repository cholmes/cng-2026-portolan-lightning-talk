<script>
// The title block and its speaker notes are authored above the first `##`,
// which puts them in a slide of their own. Move both onto Quarto's title slide
// and drop the leftover. This runs immediately, before RevealJS initializes,
// so the empty slide never counts.
(function () {
  var block = document.getElementById('title-block');
  var titleSlide = document.getElementById('title-slide');
  if (!block || !titleSlide) return;
  var leftover = block.closest('section');
  titleSlide.appendChild(block);
  var notes = leftover && leftover.querySelector('aside.notes');
  if (notes) titleSlide.appendChild(notes);
  if (leftover) leftover.remove();
})();

document.addEventListener('DOMContentLoaded', function () {
  // Give the title slide a clean URL hash (#/slide-title, not #/title-slide)
  var titleSlide = document.getElementById('title-slide');
  if (titleSlide) titleSlide.id = 'slide-title';

  // Countdown bar: sits above the RevealJS progress bar and drains
  // right-to-left over each slide's 15 seconds. Only shown while auto-advance
  // is on (so not under ?autoSlide=0), where it would count down to nothing.
  function resetCountdown() {
    var fill = document.getElementById('slide-countdown-fill');
    fill.style.animation = 'none';
    fill.offsetHeight; // force reflow
    fill.style.animation = '';
  }

  function startCountdown() {
    if (!Reveal.getConfig().autoSlide) return;
    var bar = document.createElement('div');
    bar.id = 'slide-countdown';
    bar.innerHTML = '<div id="slide-countdown-fill"></div>';
    document.querySelector('.reveal').appendChild(bar);
    resetCountdown();
    Reveal.on('slidechanged', resetCountdown);
  }

  // Each screen recording carries data-autoplay, so RevealJS rewinds it to 0
  // and plays it whenever its slide becomes current. Nothing to do here.
  function boot() {
    startCountdown();
  }

  // Reveal may already be ready by now; if so its 'ready' event has been missed
  if (Reveal.isReady()) boot();
  else Reveal.on('ready', boot);
});
</script>
